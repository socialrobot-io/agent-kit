<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="480" viewBox="0 0 1040 480" role="img" aria-labelledby="title desc">
  <title id="title">agent-kit loop</title>
  <desc id="desc">Open, guard, curate, approve, recall on a per-tenant AgentFS volume. Agent files are written once up front.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.5L8 5L0 8.5z" fill="#5B4BDB"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 1.5L8 5L0 8.5z" fill="#0F766E"/>
    </marker>
    <linearGradient id="volume" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B4BDB" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#0F766E" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="1040" height="480" rx="16" fill="#FAFAFC" stroke="#E4E4EC"/>

  <text x="36" y="40" fill="#12121A" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="18" font-weight="700">The agent loop</text>
  <text x="36" y="62" fill="#5C5C72" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12">Writes are gated. Memory improves only after approval.</text>

  <!-- Setup, outside the loop -->
  <rect x="700" y="24" width="304" height="44" rx="10" fill="#FFFFFF" stroke="#E4E4EC"/>
  <text x="720" y="42" fill="#8A8AA3" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10" font-weight="600" letter-spacing="0.4">ONCE</text>
  <text x="720" y="58" fill="#12121A" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">SOUL.md · AGENTS.md · skills</text>

  <rect x="24" y="80" width="992" height="376" rx="14" fill="#FFFFFF" stroke="#D0D0DC" stroke-dasharray="5 4"/>
  <text x="44" y="106" fill="#0F766E" font-family="ui-monospace, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="0.6">TENANT BOUNDARY</text>

  <!-- 1 Open -->
  <rect x="48" y="128" width="288" height="88" rx="12" fill="#FFFFFF" stroke="#5B4BDB" stroke-width="1.75"/>
  <circle cx="72" cy="154" r="12" fill="#5B4BDB"/>
  <text x="72" y="158" text-anchor="middle" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">1</text>
  <text x="94" y="159" fill="#12121A" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Open</text>
  <text x="68" y="192" fill="#5C5C72" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12">session · frozen memory</text>

  <!-- 2 Guard -->
  <rect x="376" y="128" width="288" height="88" rx="12" fill="#FFFFFF" stroke="#E4E4EC"/>
  <circle cx="400" cy="154" r="12" fill="#5B4BDB"/>
  <text x="400" y="158" text-anchor="middle" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">2</text>
  <text x="422" y="159" fill="#12121A" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Guard</text>
  <text x="396" y="192" fill="#5C5C72" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12">scan · sandbox</text>

  <!-- 3 Curate -->
  <rect x="704" y="128" width="288" height="88" rx="12" fill="#FFFFFF" stroke="#E4E4EC"/>
  <circle cx="728" cy="154" r="12" fill="#5B4BDB"/>
  <text x="728" y="158" text-anchor="middle" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">3</text>
  <text x="750" y="159" fill="#12121A" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Curate</text>
  <text x="724" y="192" fill="#5C5C72" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12">propose memory / skills</text>

  <path d="M336 172 H368" stroke="#5B4BDB" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M664 172 H696" stroke="#5B4BDB" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M848 216 V248" stroke="#5B4BDB" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- 4 Approve -->
  <rect x="536" y="256" width="456" height="72" rx="12" fill="#FFFFFF" stroke="#E4E4EC"/>
  <circle cx="560" cy="282" r="12" fill="#0F766E"/>
  <text x="560" y="286" text-anchor="middle" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">4</text>
  <text x="582" y="287" fill="#12121A" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Approve</text>
  <text x="556" y="312" fill="#5C5C72" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12">pending/ until a human accepts</text>

  <path d="M536 292 H510" stroke="#0F766E" stroke-width="1.75" marker-end="url(#arrow-teal)"/>

  <!-- 5 Recall -->
  <rect x="48" y="256" width="454" height="72" rx="12" fill="#FFFFFF" stroke="#E4E4EC"/>
  <circle cx="72" cy="282" r="12" fill="#0F766E"/>
  <text x="72" y="286" text-anchor="middle" fill="#FFFFFF" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">5</text>
  <text x="94" y="287" fill="#12121A" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Recall</text>
  <text x="68" y="312" fill="#5C5C72" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12">approved memory · searchable chats</text>

  <path d="M153 256 C153 238 192 238 192 216" stroke="#8A8AA3" stroke-width="1.4" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>
  <rect x="100" y="224" width="78" height="18" rx="9" fill="#FFFFFF"/>
  <text x="139" y="237" text-anchor="middle" fill="#8A8AA3" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="10">next session</text>

  <rect x="48" y="356" width="944" height="78" rx="12" fill="url(#volume)" stroke="#5B4BDB" stroke-opacity="0.30"/>
  <text x="520" y="390" text-anchor="middle" fill="#12121A" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="15" font-weight="700">Per-tenant AgentFS volume</text>
  <text x="520" y="414" text-anchor="middle" fill="#5C5C72" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-size="12">Isolated filesystem, memory, skills, transcripts</text>
</svg>
