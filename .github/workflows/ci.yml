name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test packages
        run: bunx nx run-many -t test --projects=core,sessions,ai,sandbox,curator --parallel=3

      - name: Build packages
        run: bunx nx run-many -t build --projects=core,sessions,ai,sandbox,curator,cli --parallel=3

      - name: Typecheck (packages with clean declaration emit)
        run: bunx nx run-many -t typecheck --projects=core,sessions,ai,curator --parallel=3
