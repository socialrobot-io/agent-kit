name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gate:
    name: test-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Real server for the agent-kit-node/postgres specs (they skip without it).
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agentkit
          POSTGRES_PASSWORD: agentkit
          POSTGRES_DB: agentkit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentkit"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGENT_KIT_TEST_DATABASE_URL: postgres://agentkit:agentkit@localhost:5432/agentkit_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Test packages
        run: bunx nx run-many -t test --projects=core,sessions,ai,sandbox,curator,node --parallel=3

      - name: Build packages
        run: bunx nx run-many -t build --projects=core,sessions,ai,sandbox,curator,cli,node --parallel=3

      - name: Typecheck (packages with clean declaration emit)
        run: bunx nx run-many -t typecheck --projects=core,sessions,ai,curator,node --parallel=3
